# Triage config (T5). Minimal-subset YAML, read by src/curation/triage.py:
# `#` comments, flat `key: value` scalars (int, float, plain or quoted
# string), and top-level `- item` lists. One value per line. Values must not
# contain `#`; quote values containing `:`. The reader strips quotes
# verbatim (no escape processing), so regexes use single quotes with single
# backslashes, and double quotes only for values containing apostrophes.
model: rules-triage/v1
prompt_version: triage/v1
seed: 42
min_accept_score: 3
relevance_cutoff_5: 0.30
relevance_cutoff_4: 0.15
relevance_cutoff_3: 0.05
dosage_pattern: '\b\d+(?:\.\d+)?\s?(?:mg|mcg|g|grams?|ml|units?|iu|tablets?|pills?|capsules?|drops?|times (?:a|per) day)\b'
diagnosis_pattern: "you have|you're suffering from|you are suffering from|diagnosed with|diagnosis is|this is clearly|definitely have"
treatment_pattern: "you should (take|start|try|use)|i (recommend|suggest|advise) (you )?(take|taking|start|trying|use|using)|i prescribe|prescribed for you"
percent_pattern: '\d+\s?%|\d+ percent|studies show|research shows|studies have shown'
email_pattern: '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}'
phone_pattern: '\+?\d[\d\s().-]{7,}\d'
dimensions:
  - relevance
  - response_quality
  - medical_plausibility
  - safety
  - unsupported_claims
  - hallucination
  - diagnostic_overreach
  - missing_critical_context
  - conversational_appropriateness
  - empathy_tone
  - instruction_adherence
